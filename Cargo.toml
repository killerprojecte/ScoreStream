[workspace]
resolver = "2"
members = ["crates/scorestream-core", "crates/scorestream-codec", "crates/scorestream-app", "crates/scorestream-cli", "crates/scorestream-mcp", "crates/scorestream-formats"]
exclude = ["crates/scorestream-desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-bigint = { version = "0.4", features = ["serde"] }
num-rational = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
sha2 = "0.10"
thiserror = "2"

