[package]
name = "scorestream-vst3-catalog"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Metadata-only VST3 candidate discovery; never loads plug-in code"

[workspace]

[dependencies]
json5 = "=0.4.1"
serde = { version = "=1.0.228", features = ["derive"] }
sha2 = "=0.10.9"

[dev-dependencies]
serde_json = "=1.0.145"
tempfile = "=3.27.0"
